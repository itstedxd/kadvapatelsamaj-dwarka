  <style>
    /* ===== CSS DESIGN TOKENS ===== */
    :root {
      --clr-gold:       #C5973A;
      --clr-gold-light: #E8C87A;
      --clr-gold-pale:  #F7EDD5;
      --clr-saffron:    #E8720C;
      --clr-deep:       #1A1208;
      --clr-dark:       #2C1F0E;
      --clr-brown:      #5C3D1E;
      --clr-warm:       #8B6340;
      --clr-muted:      #A08060;
      --clr-surface:    #FDFAF4;
      --clr-cream:      #F9F3E8;
      --clr-border:     #E8D9C0;
      --clr-white:      #FFFFFF;
      --clr-text:       #2C1F0E;
      --clr-text-muted: #6B5240;

      --ff-display: 'Cinzel', 'Playfair Display', Georgia, serif;
      --ff-heading: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
      --ff-body:    'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ff-guj:     'Noto Sans Gujarati', sans-serif;

      --radius-sm:  4px;
      --radius-md:  8px;
      --radius-lg:  16px;
      --radius-xl:  24px;
      --radius-2xl: 40px;

      --shadow-sm:  0 1px 3px rgba(28,15,4,0.08), 0 1px 2px rgba(28,15,4,0.06);
      --shadow-md:  0 4px 16px rgba(28,15,4,0.10), 0 2px 6px rgba(28,15,4,0.06);
      --shadow-lg:  0 10px 40px rgba(28,15,4,0.14), 0 4px 12px rgba(28,15,4,0.08);
      --shadow-xl:  0 20px 60px rgba(28,15,4,0.18), 0 8px 24px rgba(28,15,4,0.10);
      --shadow-gold: 0 4px 24px rgba(197,151,58,0.25);

      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.6s cubic-bezier(0.4, 0, 0.2, 1);

      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
      --space-12: 48px; --space-16: 64px; --space-20: 80px; --space-24: 96px;
      --space-32: 128px;

      --max-w: 1240px;
    }

    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--ff-body);
      background: var(--clr-surface);
      color: var(--clr-text);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    ul, ol { list-style: none; }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--clr-cream); }
    ::-webkit-scrollbar-thumb { background: var(--clr-gold); border-radius: 3px; }

    /* ===== UTILITY ===== */
    .container { max-width: var(--max-w); margin: 0 auto; padding: 0 var(--space-6); }
    .section { padding: var(--space-24) 0; }
    .section-sm { padding: var(--space-16) 0; }

    .badge {
      display: inline-flex; align-items: center; gap: var(--space-1);
      padding: var(--space-1) var(--space-3);
      background: var(--clr-gold-pale); color: var(--clr-gold);
      border: 1px solid rgba(197,151,58,0.3);
      border-radius: 100px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .section-label {
      font-family: var(--ff-body); font-size: 12px; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--clr-gold); margin-bottom: var(--space-3);
    }
    .section-title {
      font-family: var(--ff-heading); font-size: clamp(34px, 5.5vw, 54px);
      font-weight: 600; line-height: 1.15; color: var(--clr-deep);
      letter-spacing: -0.01em;
      margin-bottom: var(--space-4);
    }
    .section-subtitle {
      font-family: var(--ff-body);
      font-size: clamp(15px, 2vw, 17px); color: var(--clr-text-muted);
      max-width: 620px; line-height: 1.7; font-weight: 400;
    }
    .divider {
      width: 54px; height: 2.5px;
      background: linear-gradient(90deg, var(--clr-gold), var(--clr-saffron));
      border-radius: 2px; margin: var(--space-4) 0 var(--space-6);
    }
    .divider-center { margin-left: auto; margin-right: auto; }

    .btn {
      font-family: var(--ff-body);
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      padding: 14px var(--space-8); border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; letter-spacing: 0.09em;
      transition: var(--transition); text-transform: uppercase;
      text-decoration: none; cursor: pointer;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--clr-gold) 0%, var(--clr-saffron) 100%);
      color: var(--clr-white); box-shadow: var(--shadow-gold);
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(197,151,58,0.4); }
    .btn-outline {
      background: transparent; color: var(--clr-gold);
      border: 1.5px solid var(--clr-gold);
    }
    .btn-outline:hover { background: var(--clr-gold-pale); transform: translateY(-1px); }
    .btn-white {
      background: var(--clr-white); color: var(--clr-dark); box-shadow: var(--shadow-md);
    }
    .btn-white:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

    /* ===== NAVBAR ===== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      transition: var(--transition);
    }
    .navbar.scrolled {
      background: rgba(253,250,244,0.97);
      backdrop-filter: blur(16px);
      box-shadow: 0 1px 0 var(--clr-border), var(--shadow-sm);
    }
    .navbar-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-5) var(--space-6);
      max-width: var(--max-w); margin: 0 auto;
    }
    .navbar-logo { display: flex; align-items: center; gap: var(--space-3); }
    .logo-img {
      height: 44px; width: 44px;
      object-fit: contain; flex-shrink: 0;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 2px;
      border: 1.5px solid var(--clr-gold);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: var(--transition-fast);
    }
    .logo-img:hover { transform: scale(1.06); }
    .logo-mark {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--clr-gold) 0%, var(--clr-saffron) 100%);
      display: flex; align-items: center; justify-content: center;
      color: white; font-family: var(--ff-display); font-size: 20px; font-weight: 700;
      box-shadow: var(--shadow-gold); flex-shrink: 0;
    }
    .logo-text-en {
      font-family: var(--ff-display); font-size: 17px; font-weight: 600;
      color: var(--clr-deep); line-height: 1.1;
    }
    .logo-text-guj {
      font-family: var(--ff-guj); font-size: 12px;
      color: var(--clr-gold); line-height: 1.2;
    }
    .navbar.scrolled .logo-text-en { color: var(--clr-deep); }
    .navbar:not(.scrolled) .logo-text-en { color: var(--clr-white); }
    .navbar:not(.scrolled) .logo-text-guj { color: var(--clr-gold-light); }
    .navbar:not(.scrolled) .nav-link { color: rgba(255,255,255,0.88); }
    .navbar:not(.scrolled) .nav-link:hover { color: var(--clr-gold-light); }

    .nav-links { display: flex; align-items: center; gap: var(--space-8); }
    .nav-link {
      font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--clr-text-muted); transition: var(--transition-fast);
      position: relative;
    }
    .nav-link::after {
      content: ''; position: absolute; bottom: -3px; left: 0; right: 0;
      height: 1.5px; background: var(--clr-gold); border-radius: 1px;
      transform: scaleX(0); transition: var(--transition-fast);
    }
    .nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }
    .nav-link:hover { color: var(--clr-gold); }

    .nav-cta { display: flex; align-items: center; gap: var(--space-3); }
    .nav-phone {
      font-size: 13px; font-weight: 600; color: var(--clr-gold);
      display: flex; align-items: center; gap: var(--space-1);
    }
    .navbar:not(.scrolled) .nav-phone { color: var(--clr-gold-light); }

    .hamburger { display: none; flex-direction: column; gap: 5px; padding: 4px; }
    .hamburger span {
      display: block; width: 24px; height: 2px; background: currentColor;
      border-radius: 2px; transition: var(--transition);
    }
    .mobile-menu {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--clr-surface); z-index: 999;
      flex-direction: column; align-items: center; justify-content: center;
      gap: var(--space-8);
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu .nav-link {
      font-size: 22px; color: var(--clr-dark);
    }
    .mobile-menu-close {
      position: absolute; top: var(--space-6); right: var(--space-6);
      font-size: 28px; color: var(--clr-dark); background: none; border: none;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
    }
    .hero-bg img {
      width: 100%; height: 100%; object-fit: cover;
      transform: scale(1.05);
      animation: heroZoom 20s ease-in-out infinite alternate;
    }
    @keyframes heroZoom {
      from { transform: scale(1.05); }
      to   { transform: scale(1.12); }
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        170deg,
        rgba(26,18,8,0.65) 0%,
        rgba(44,31,14,0.75) 50%,
        rgba(26,18,8,0.85) 100%
      );
    }
    .hero-pattern {
      position: absolute; inset: 0; opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C5973A' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-content {
      position: relative; z-index: 1; text-align: center;
      max-width: 820px; padding: 0 var(--space-6);
      animation: fadeUp 1s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: var(--space-2);
      color: var(--clr-gold-light); font-size: 12px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: var(--space-5);
    }
    .hero-eyebrow::before, .hero-eyebrow::after {
      content: ''; display: block; width: 32px; height: 1px;
      background: var(--clr-gold-light); opacity: 0.6;
    }
    .hero-title {
      font-family: var(--ff-display);
      font-size: clamp(44px, 8vw, 88px);
      font-weight: 600; line-height: 1.0;
      color: var(--clr-white);
      text-shadow: 0 2px 32px rgba(0,0,0,0.3);
      margin-bottom: var(--space-3);
    }
    .hero-title-guj {
      font-family: var(--ff-guj);
      font-size: clamp(18px, 3vw, 28px);
      color: var(--clr-gold-light); font-weight: 500;
      margin-bottom: var(--space-6);
      display: block;
    }
    .hero-desc {
      font-size: clamp(16px, 2vw, 19px);
      color: rgba(255,255,255,0.80);
      max-width: 560px; margin: 0 auto var(--space-10);
      line-height: 1.65;
    }
    .hero-actions {
      display: flex; align-items: center; justify-content: center;
      gap: var(--space-4); flex-wrap: wrap;
      margin-bottom: var(--space-16);
    }
    .hero-stats {
      display: flex; align-items: center; justify-content: center;
      gap: var(--space-10); flex-wrap: wrap;
    }
    .hero-stat { text-align: center; }
    .hero-stat-num {
      font-family: var(--ff-display); font-size: 32px; font-weight: 600;
      color: var(--clr-gold-light); line-height: 1;
    }
    .hero-stat-label {
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.55); margin-top: 4px;
    }
    .hero-stat-divider { width: 1px; height: 40px; background: rgba(255,255,255,0.15); }
    .hero-scroll {
      position: absolute; bottom: var(--space-10); left: 50%; transform: translateX(-50%);
      z-index: 1; display: flex; flex-direction: column; align-items: center;
      gap: var(--space-2); color: rgba(255,255,255,0.5);
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      animation: bounce 2.5s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }

    /* ===== ABOUT STRIP ===== */
    .trust-strip {
      background: var(--clr-dark);
      padding: var(--space-5) 0;
      overflow: hidden;
    }
    .trust-strip-inner {
      display: flex; align-items: center; justify-content: center;
      gap: var(--space-10); flex-wrap: wrap;
      max-width: var(--max-w); margin: 0 auto; padding: 0 var(--space-6);
    }
    .trust-item {
      display: flex; align-items: center; gap: var(--space-3);
      color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 500;
    }
    .trust-item svg { color: var(--clr-gold); }
    .trust-divider-vert { width: 1px; height: 24px; background: rgba(255,255,255,0.12); }

    /* ===== ABOUT ===== */
    .about-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--space-16); align-items: center;
    }
    .about-images {
      position: relative; height: 540px;
    }
    .about-img-main {
      position: absolute; top: 0; left: 0;
      width: 70%; height: 80%;
      border-radius: var(--radius-lg);
      overflow: hidden; box-shadow: var(--shadow-xl);
    }
    .about-img-main img { width: 100%; height: 100%; object-fit: cover; }
    .about-img-accent {
      position: absolute; bottom: 0; right: 0;
      width: 55%; height: 55%;
      border-radius: var(--radius-lg);
      overflow: hidden; box-shadow: var(--shadow-xl);
      border: 4px solid var(--clr-surface);
    }
    .about-img-accent img { width: 100%; height: 100%; object-fit: cover; }
    .about-badge-float {
      position: absolute; top: 50%; left: 55%; transform: translate(-50%, -50%);
      background: var(--clr-gold); color: white;
      padding: var(--space-5) var(--space-6);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-gold);
      text-align: center; z-index: 2;
    }
    .about-badge-num { font-family: var(--ff-display); font-size: 32px; font-weight: 700; line-height: 1; }
    .about-badge-text { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.9; }
    .about-features { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-top: var(--space-8); }
    .about-feature {
      display: flex; gap: var(--space-3); align-items: flex-start;
      padding: var(--space-4); background: var(--clr-cream);
      border-radius: var(--radius-md); border: 1px solid var(--clr-border);
    }
    .about-feature-icon {
      width: 36px; height: 36px; background: var(--clr-gold-pale);
      border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
      color: var(--clr-gold); flex-shrink: 0;
    }
    .about-feature-label { font-size: 13px; font-weight: 600; color: var(--clr-dark); }
    .about-feature-desc { font-size: 12px; color: var(--clr-text-muted); margin-top: 2px; }

    /* ===== AMENITIES ===== */
    .amenities-bg { background: var(--clr-cream); }
    .amenities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: var(--space-5);
    }
    .amenity-card {
      background: var(--clr-white); border-radius: var(--radius-xl);
      padding: var(--space-8) var(--space-6); border: 1px solid var(--clr-border);
      text-align: center; transition: var(--transition);
      box-shadow: 0 4px 18px rgba(44,31,14,0.04);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    }
    .amenity-card:hover {
      border-color: var(--clr-gold);
      box-shadow: 0 12px 36px rgba(197,151,58,0.22);
      transform: translateY(-6px);
    }
    .amenity-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #FBF4E6, #F5E7CC);
      border: 1.5px solid rgba(197,151,58,0.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-5); color: var(--clr-gold);
      transition: var(--transition);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 12px rgba(197,151,58,0.1);
    }
    .amenity-card:hover .amenity-icon {
      background: linear-gradient(135deg, var(--clr-gold), var(--clr-saffron));
      color: white; border-color: transparent;
      transform: scale(1.1);
      box-shadow: 0 8px 24px rgba(197,151,58,0.35);
    }
    .amenity-name {
      font-family: var(--ff-heading);
      font-size: 18px; font-weight: 600;
      color: var(--clr-deep);
      letter-spacing: 0.01em;
      line-height: 1.3;
      margin-bottom: var(--space-2);
    }
    .amenity-desc {
      font-family: var(--ff-body);
      font-size: 13.5px;
      color: var(--clr-text-muted);
      line-height: 1.6;
    }

    /* ===== ROOMS ===== */
    .rooms-header { text-align: center; margin-bottom: var(--space-12); }
    .rooms-filter {
      display: flex; align-items: center; justify-content: center;
      gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-6);
    }
    .filter-btn {
      padding: 8px var(--space-5); border-radius: 100px;
      font-size: 13px; font-weight: 500; transition: var(--transition);
      border: 1.5px solid var(--clr-border); color: var(--clr-text-muted);
      background: var(--clr-white);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--clr-gold); color: white; border-color: var(--clr-gold);
    }

    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: var(--space-6);
    }
    .room-card {
      background: var(--clr-white); border-radius: var(--radius-xl);
      overflow: hidden; box-shadow: var(--shadow-md);
      border: 1px solid var(--clr-border); transition: var(--transition);
    }
    .room-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-xl); }
    .room-img {
      position: relative; height: 220px; overflow: hidden;
    }
    .room-img img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition-slow); }
    .room-card:hover .room-img img { transform: scale(1.06); }
    .room-badge-wrap { position: absolute; top: var(--space-4); left: var(--space-4); display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .room-badge-ac {
      background: rgba(26,18,8,0.75); color: white; backdrop-filter: blur(8px);
      padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 600;
    }
    .room-badge-pop {
      background: var(--clr-saffron); color: white;
      padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 600;
    }
    .room-body { padding: var(--space-6); }
    .room-name { font-family: var(--ff-display); font-size: 22px; font-weight: 600; color: var(--clr-deep); }
    .room-desc { font-size: 13px; color: var(--clr-text-muted); margin: var(--space-2) 0 var(--space-4); line-height: 1.6; }
    .room-features {
      display: flex; gap: var(--space-4); flex-wrap: wrap;
      padding: var(--space-4) 0;
      border-top: 1px solid var(--clr-border);
      border-bottom: 1px solid var(--clr-border);
      margin-bottom: var(--space-5);
    }
    .room-feat { display: flex; align-items: center; gap: var(--space-1); font-size: 12px; color: var(--clr-text-muted); }
    .room-feat svg { color: var(--clr-gold); }
    .room-footer { display: flex; align-items: center; justify-content: space-between; }
    .room-price { }
    .room-price-num {
      font-family: var(--ff-display); font-size: 28px; font-weight: 700;
      color: var(--clr-dark); line-height: 1;
    }
    .room-price-per { font-size: 11px; color: var(--clr-text-muted); }
    .room-book-btn {
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; cursor: pointer;
      padding: 10px var(--space-5); border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--clr-gold), var(--clr-saffron));
      color: white; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
      transition: var(--transition); text-transform: uppercase;
    }
    .room-book-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-gold); }

    /* ===== LOCATION ===== */
    .location-bg { background: var(--clr-cream); }
    .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-12); align-items: start; }
    .map-container {
      border-radius: var(--radius-xl); overflow: hidden;
      box-shadow: var(--shadow-xl); aspect-ratio: 4/3;
      border: 1px solid var(--clr-border);
    }
    .map-container iframe { width: 100%; height: 100%; border: none; }
    .location-info { padding-top: var(--space-4); }
    .location-cards { display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-6); }
    .loc-card {
      display: flex; gap: var(--space-4); align-items: flex-start;
      padding: var(--space-5); background: var(--clr-white);
      border-radius: var(--radius-lg); border: 1px solid var(--clr-border);
      box-shadow: var(--shadow-sm);
    }
    .loc-icon {
      width: 44px; height: 44px; border-radius: var(--radius-md);
      background: var(--clr-gold-pale); color: var(--clr-gold);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .loc-label { font-weight: 600; font-size: 14px; color: var(--clr-dark); }
    .loc-value { font-size: 13px; color: var(--clr-text-muted); margin-top: 2px; }
    .nearby-list { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-6); }
    .nearby-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      background: var(--clr-white); border-radius: var(--radius-md);
      border: 1px solid var(--clr-border); font-size: 13px;
    }
    .nearby-name { display: flex; align-items: center; gap: var(--space-2); color: var(--clr-dark); font-weight: 500; }
    .nearby-dist { color: var(--clr-gold); font-weight: 600; font-size: 12px; }

    /* ===== GALLERY ===== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 240px);
      gap: var(--space-3);
      border-radius: var(--radius-xl); overflow: hidden;
    }
    .gallery-item { overflow: hidden; cursor: pointer; position: relative; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition-slow); }
    .gallery-item:hover img { transform: scale(1.08); }
    .gallery-item:hover::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(197,151,58,0.2); transition: var(--transition);
    }
    .gallery-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
    .gallery-item:nth-child(4) { grid-column: span 2; }

    /* ===== DINING ===== */
    .dining-bg {
      background: var(--clr-dark);
      position: relative; overflow: hidden;
    }
    .dining-bg::before {
      content: ''; position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C5973A' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .dining-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-16); align-items: center; }
    .dining-content { position: relative; }
    .dining-title { color: var(--clr-white); }
    .dining-subtitle { color: rgba(255,255,255,0.65); }
    .dining-menu {
      margin-top: var(--space-8);
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);
    }
    .dining-item {
      padding: var(--space-5); background: rgba(255,255,255,0.05);
      border: 1px solid rgba(197,151,58,0.2); border-radius: var(--radius-lg);
    }
    .dining-item-icon { font-size: 24px; margin-bottom: var(--space-2); }
    .dining-item-name { font-weight: 600; font-size: 14px; color: var(--clr-gold-light); }
    .dining-item-desc { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
    .dining-imgs { position: relative; height: 480px; }
    .dining-img-wrap {
      position: absolute; border-radius: var(--radius-xl); overflow: hidden;
      box-shadow: var(--shadow-xl);
    }
    .dining-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .dining-img-main { top: 0; right: 0; width: 75%; height: 70%; }
    .dining-img-sec { bottom: 0; left: 0; width: 55%; height: 50%; border: 3px solid var(--clr-dark); }
    .dining-tag {
      position: absolute; top: var(--space-5); left: var(--space-5);
      background: var(--clr-gold); color: white;
      padding: var(--space-2) var(--space-4); border-radius: 100px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* ===== REVIEWS ===== */
    .reviews-bg { background: var(--clr-cream); }
    .reviews-header { text-align: center; margin-bottom: var(--space-12); }
    .rating-summary {
      display: flex; align-items: center; gap: var(--space-10);
      justify-content: center; margin-bottom: var(--space-10);
    }
    .rating-big {
      text-align: center;
    }
    .rating-num {
      font-family: var(--ff-display); font-size: 72px; font-weight: 300;
      color: var(--clr-gold); line-height: 1;
    }
    .stars-row { display: flex; gap: 3px; justify-content: center; margin: var(--space-2) 0; }
    .star { color: var(--clr-gold); font-size: 18px; }
    .star.empty { color: var(--clr-border); }
    .rating-count { font-size: 13px; color: var(--clr-text-muted); }
    .rating-bars { flex: 1; max-width: 320px; display: flex; flex-direction: column; gap: var(--space-2); }
    .rating-bar-row { display: flex; align-items: center; gap: var(--space-3); font-size: 12px; }
    .rating-bar-label { width: 36px; color: var(--clr-text-muted); text-align: right; }
    .rating-bar-track { flex: 1; height: 6px; background: var(--clr-border); border-radius: 3px; overflow: hidden; }
    .rating-bar-fill { height: 100%; background: var(--clr-gold); border-radius: 3px; }
    .rating-bar-pct { width: 32px; color: var(--clr-text-muted); font-size: 11px; }

    .reviews-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-5); }
    .review-card {
      background: var(--clr-white); border-radius: var(--radius-xl);
      padding: var(--space-6); border: 1px solid var(--clr-border);
      box-shadow: var(--shadow-sm); transition: var(--transition);
    }
    .review-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
    .review-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-4); }
    .reviewer { display: flex; align-items: center; gap: var(--space-3); }
    .reviewer-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-gold), var(--clr-saffron));
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 16px; font-family: var(--ff-display);
    }
    .reviewer-name { font-weight: 600; font-size: 14px; color: var(--clr-dark); }
    .reviewer-src { font-size: 11px; color: var(--clr-text-muted); display: flex; align-items: center; gap: 3px; }
    .review-quote {
      font-size: 32px; color: var(--clr-gold); line-height: 1; font-family: var(--ff-display);
    }
    .review-text { font-size: 14px; color: var(--clr-text-muted); line-height: 1.65; }
    .review-date { font-size: 11px; color: var(--clr-muted); margin-top: var(--space-4); }
    .review-stars { display: flex; gap: 2px; margin-top: var(--space-3); }
    .review-star { color: var(--clr-gold); font-size: 13px; }

    /* ===== BOOKING CTA ===== */
    .booking-cta {
      background: linear-gradient(135deg, var(--clr-gold) 0%, var(--clr-saffron) 60%, #D4531A 100%);
      position: relative; overflow: hidden;
    }
    .booking-cta::before {
      content: ''; position: absolute; inset: 0; opacity: 0.07;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FFFFFF' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .booking-cta-inner {
      position: relative; display: flex; align-items: center;
      justify-content: space-between; gap: var(--space-10);
      flex-wrap: wrap;
    }
    .booking-cta-title {
      font-family: var(--ff-display); font-size: clamp(28px, 4vw, 44px);
      font-weight: 600; color: white; line-height: 1.1;
    }
    .booking-cta-sub { color: rgba(255,255,255,0.75); font-size: 16px; margin-top: var(--space-2); }
    .booking-cta-actions { display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: center; }

    /* ===== CONTACT ===== */
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-12); }
    .contact-cards { display: flex; flex-direction: column; gap: var(--space-5); }
    .contact-card {
      display: flex; gap: var(--space-5); align-items: flex-start;
      padding: var(--space-6); background: var(--clr-cream);
      border-radius: var(--radius-xl); border: 1px solid var(--clr-border);
      transition: var(--transition);
    }
    .contact-card:hover { border-color: var(--clr-gold); box-shadow: var(--shadow-gold); }
    .contact-icon {
      width: 52px; height: 52px; border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--clr-gold), var(--clr-saffron));
      display: flex; align-items: center; justify-content: center;
      color: white; flex-shrink: 0;
    }
    .contact-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--clr-gold); }
    .contact-value { font-size: 16px; font-weight: 600; color: var(--clr-dark); margin-top: 4px; }
    .contact-hint { font-size: 12px; color: var(--clr-text-muted); margin-top: 2px; }

    .contact-form { background: var(--clr-cream); border-radius: var(--radius-xl); padding: var(--space-8); border: 1px solid var(--clr-border); }
    .form-title { font-family: var(--ff-display); font-size: 24px; font-weight: 600; color: var(--clr-dark); margin-bottom: var(--space-6); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    .form-group { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
    .form-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--clr-dark); }
    .form-input, .form-select, .form-textarea {
      padding: 12px var(--space-4); border-radius: var(--radius-md);
      border: 1.5px solid var(--clr-border); background: var(--clr-white);
      font-family: var(--ff-body); font-size: 14px; color: var(--clr-dark);
      transition: var(--transition-fast); outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--clr-gold); box-shadow: 0 0 0 3px rgba(197,151,58,0.12);
    }
    .form-textarea { resize: vertical; min-height: 100px; }
    .form-submit {
      width: 100%; padding: 15px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--clr-gold), var(--clr-saffron));
      color: white; font-size: 14px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; transition: var(--transition);
      box-shadow: var(--shadow-gold);
    }
    .form-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(197,151,58,0.4); }

    /* ===== FOOTER ===== */
    .footer { background: var(--clr-deep); padding: var(--space-20) 0 0; }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--space-10); padding-bottom: var(--space-16); }
    .footer-about .logo-text-en { color: white; }
    .footer-about .logo-text-guj { color: var(--clr-gold-light); }
    .footer-desc { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.7; margin-top: var(--space-4); max-width: 280px; }
    .footer-social { display: flex; gap: var(--space-3); margin-top: var(--space-6); }
    .footer-social a {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6);
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition); font-size: 14px;
    }
    .footer-social a:hover { background: var(--clr-gold); color: white; }
    .footer-heading { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--clr-gold); margin-bottom: var(--space-5); }
    .footer-links { display: flex; flex-direction: column; gap: var(--space-3); }
    .footer-links a { font-size: 13px; color: rgba(255,255,255,0.5); transition: var(--transition-fast); }
    .footer-links a:hover { color: var(--clr-gold-light); }
    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: var(--space-6) 0;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: var(--space-4);
    }
    .footer-copy { font-size: 12px; color: rgba(255,255,255,0.3); }
    .footer-trust {
      display: flex; align-items: center; gap: var(--space-2);
      font-size: 12px; color: rgba(255,255,255,0.3);
    }
    .footer-trust span { color: var(--clr-gold); }

    /* ===== BOOKING MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(26,18,8,0.75);
      backdrop-filter: blur(8px); z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-6);
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--clr-surface); border-radius: var(--radius-2xl);
      padding: var(--space-10); width: 100%; max-width: 540px;
      box-shadow: var(--shadow-xl); position: relative;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(32px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-close {
      position: absolute; top: var(--space-5); right: var(--space-5);
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--clr-cream); color: var(--clr-text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition-fast);
    }
    .modal-close:hover { background: var(--clr-border); color: var(--clr-dark); }
    .modal-title { font-family: var(--ff-display); font-size: 28px; font-weight: 600; color: var(--clr-deep); margin-bottom: var(--space-2); }
    .modal-sub { font-size: 14px; color: var(--clr-text-muted); margin-bottom: var(--space-6); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: var(--space-8); left: 50%; transform: translateX(-50%);
      background: var(--clr-dark); color: white; border-radius: var(--radius-xl);
      padding: var(--space-4) var(--space-8); font-size: 14px; font-weight: 500;
      box-shadow: var(--shadow-xl); z-index: 3000; display: flex; align-items: center; gap: var(--space-3);
      animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .toast-icon { color: var(--clr-gold); }

    /* ===== BACK TO TOP ===== */
    .back-to-top {
      position: fixed; bottom: 94px; right: 24px; z-index: 500;
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-gold), var(--clr-saffron));
      color: white; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(44,31,14,0.18); transition: var(--transition);
      opacity: 0; pointer-events: none;
    }
    .back-to-top.visible { opacity: 1; pointer-events: auto; }
    .back-to-top:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(197,151,58,0.4); }

    /* ===== FLOATING WHATSAPP BUTTON ===== */
    .whatsapp-float-btn {
      position: fixed; bottom: 24px; right: 24px; z-index: 550;
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #128C7E 0%, #25D366 100%);
      color: #ffffff !important;
      padding: 10px 18px 10px 12px;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(18, 140, 126, 0.4), 0 0 0 0 rgba(37, 211, 102, 0.5);
      text-decoration: none;
      font-family: var(--ff-body);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      animation: whatsappPulse 2.8s infinite;
    }
    .whatsapp-float-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 28px rgba(18, 140, 126, 0.55), 0 0 0 8px rgba(37, 211, 102, 0.18);
      color: #ffffff !important;
    }
    .whatsapp-float-icon-wrap {
      width: 36px; height: 36px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .whatsapp-float-text {
      display: flex; flex-direction: column; align-items: flex-start;
      line-height: 1.15;
    }
    .whatsapp-float-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; opacity: 0.95;
    }
    .whatsapp-float-num {
      font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em;
    }
    @keyframes whatsappPulse {
      0% { box-shadow: 0 4px 20px rgba(18, 140, 126, 0.4), 0 0 0 0 rgba(37, 211, 102, 0.6); }
      70% { box-shadow: 0 4px 20px rgba(18, 140, 126, 0.4), 0 0 0 14px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 4px 20px rgba(18, 140, 126, 0.4), 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    /* ===== ANIMATIONS ===== */
    .reveal {
      opacity: 0; transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.in-view { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .about-grid, .location-grid, .dining-grid, .contact-grid { grid-template-columns: 1fr; }
      .about-images { height: 400px; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 200px); }
      .gallery-item:nth-child(1) { grid-column: span 2; grid-row: span 1; }
      .gallery-item:nth-child(4) { grid-column: span 1; }
    }
    @media (max-width: 768px) {
      .nav-links, .nav-cta { display: none; }
      .hamburger { display: flex; color: white; }
      .navbar.scrolled .hamburger { color: var(--clr-dark); }
      .rooms-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: 1fr; }
      .about-features { grid-template-columns: 1fr; }
      .dining-menu { grid-template-columns: 1fr; }
      .hero-stats { gap: var(--space-6); }
      .hero-stat-divider { display: none; }
      .booking-cta-inner { flex-direction: column; }
      .rating-summary { flex-direction: column; }
      .gallery-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .container { padding: 0 var(--space-4); }
      .modal { padding: var(--space-6); border-radius: var(--radius-xl); }
      .whatsapp-float-btn {
        bottom: 16px; right: 16px;
        padding: 8px 14px 8px 10px;
      }
      .whatsapp-float-num { display: none; }
      .whatsapp-float-label { font-size: 13px; letter-spacing: 0.02em; }
      .back-to-top { bottom: 76px; right: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Wait for Babel + React to be fully loaded, then fetch and compile JSX
    function loadApp() {
      if (typeof Babel === 'undefined' || typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
        return setTimeout(loadApp, 50);
      }
      fetch('src/App.jsx')
        .then(function(r) { return r.text(); })
        .then(function(code) {
          var transformed = Babel.transform(code, { presets: ['react'] }).code;
          // eslint-disable-next-line no-eval
          eval(transformed);
        })
        .catch(function(err) {
          document.getElementById('root').innerHTML =
            '<div style="font-family:sans-serif;padding:40px;text-align:center">' +
            '<div style="display:inline-block;padding:40px;background:#fff8f0;border:2px solid #C5973A;border-radius:16px;max-width:500px">' +
            '<div style="font-size:48px;margin-bottom:16px">🛕</div>' +
            '<h2 style="color:#2C1F0E;font-family:Georgia,serif;margin-bottom:12px">Uma Atithi Gruh</h2>' +
            '<p style="color:#6B5240;margin-bottom:8px"><strong>To view this website:</strong></p>' +
            '<p style="color:#6B5240">1. Start XAMPP Apache server</p>' +
            '<p style="color:#6B5240">2. Open: <a href="http://localhost/kadvapatelsamaj/" style="color:#C5973A">http://localhost/kadvapatelsamaj/</a></p>' +
            '<p style="color:#999;font-size:12px;margin-top:16px">Error: ' + (err.message || err) + '</p>' +
            '</div></div>';
        });
    }
    loadApp();
  </script>
</body>
</html>
